name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Strict X.Y.Z version matching manifests
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must be vX.Y.Z" }
            $version = $tag.TrimStart("v")
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Version SSOT
        shell: pwsh
        run: ./scripts/check-version.ps1 -Expected "${{ steps.ver.outputs.version }}"
      - name: Install frontend
        run: bun install --frozen-lockfile
      - name: Build signed NSIS
        uses: tauri-apps/tauri-action@2d3036b306d86c3198f05a460dcd23cf55ef41b9 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          includeUpdaterJson: false
      - name: Installer smoke
        shell: pwsh
        run: ./scripts/ci-installer-smoke.ps1 -Version "${{ steps.ver.outputs.version }}"
      - name: Write updater manifest
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem $nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $sig = (Get-Content -Raw "$($exe.FullName).sig").Trim()
          $version = "${{ steps.ver.outputs.version }}"
          $manifest = [ordered]@{
            version = $version
            notes = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = "https://github.com/AryaPaw/voxely/releases/download/v$version/$($exe.Name)"
              }
            }
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $nsis "latest.json"),
            ($manifest | ConvertTo-Json -Compress -Depth 5)
          )
      - name: List NSIS artifacts
        shell: pwsh
        run: Get-ChildItem "src-tauri/target/release/bundle/nsis" | Format-Table Name, Length
      - name: Publish release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Voxely ${{ steps.ver.outputs.version }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          body: |
            Download the per-user NSIS installer. Administrator rights are not required.

            Updates are signed with the Tauri updater key. Windows SmartScreen may still warn because Authenticode is not used yet.
      - name: Attest artifacts
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*
