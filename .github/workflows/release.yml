name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Strict X.Y.Z version matching manifests
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  bundle:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 75
    outputs:
      version: ${{ steps.ver.outputs.version }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT -eq "workflow_dispatch") {
            $version = $env:REQUESTED_VERSION
          } else {
            $tag = $env:RELEASE_REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must be vX.Y.Z" }
            $version = $tag.TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be X.Y.Z" }
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Version SSOT
        shell: pwsh
        run: ./scripts/check-version.ps1 -Expected "${{ steps.ver.outputs.version }}"
      - name: Verify release identity and eligibility for a fresh build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/publish-release.ps1 -Mode preflight -Version $env:RELEASE_VERSION -CandidateSha $env:CANDIDATE_SHA
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Build date from CI
        shell: pwsh
        run: echo "VOXELY_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" >> $env:GITHUB_ENV
      - name: Install frontend
        run: bun install --frozen-lockfile
      - name: Build signed NSIS
        uses: tauri-apps/tauri-action@2d3036b306d86c3198f05a460dcd23cf55ef41b9 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VOXELY_BUILD_DATE: ${{ env.VOXELY_BUILD_DATE }}
        with:
          includeUpdaterJson: false
      - name: Installer smoke
        shell: pwsh
        run: ./scripts/ci-installer-smoke.ps1 -Version "${{ steps.ver.outputs.version }}"
      - name: Write updater manifest
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $version = "${{ steps.ver.outputs.version }}"
          $exe = Get-Item (Join-Path $nsis "Voxely_${version}_x64-setup.exe") -ErrorAction Stop
          $sig = (Get-Content -Raw "$($exe.FullName).sig").Trim()
          $manifest = [ordered]@{
            version = $version
            notes = ""
            pub_date = (git show -s --format=%cI HEAD).Trim()
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = "https://github.com/AryaPaw/voxely/releases/download/v$version/$($exe.Name)"
              }
            }
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $nsis "latest.json"),
            ($manifest | ConvertTo-Json -Compress -Depth 5)
          )
      - name: Record signed bundle SHA-256 checksums
        id: fingerprint
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/publish-release.ps1 -Mode fingerprint -Version $env:RELEASE_VERSION -CandidateSha $env:GITHUB_SHA
      - name: Attest artifacts
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/Voxely_${{ steps.ver.outputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Voxely_${{ steps.ver.outputs.version }}_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
      - name: Save signed release bundle before publication
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voxely-release-v${{ steps.ver.outputs.version }}-attempt-${{ github.run_attempt }}
          path: |
            src-tauri/target/release/bundle/nsis/Voxely_${{ steps.ver.outputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Voxely_${{ steps.ver.outputs.version }}_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: bundle
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ needs.bundle.outputs.version }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Require saved bundle identity
        shell: pwsh
        env:
          BUNDLE_ID: ${{ needs.bundle.outputs.artifact_id }}
          BUNDLE_FINGERPRINT: ${{ needs.bundle.outputs.fingerprint }}
        run: |
          if ($env:BUNDLE_ID -notmatch '^[1-9]\d*$' -or $env:BUNDLE_FINGERPRINT -notmatch '^[a-f0-9]{192}$') {
            throw 'Missing artifact ID or checksums from the successful signed bundle job.'
          }
      - name: Restore signed release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.bundle.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: src-tauri/target/release/bundle/nsis
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.bundle.outputs.version }}
          BUNDLE_FINGERPRINT: ${{ needs.bundle.outputs.fingerprint }}
        run: ./scripts/publish-release.ps1 -Mode publish -Version $env:RELEASE_VERSION -CandidateSha $env:CANDIDATE_SHA -ExpectedBundleFingerprint $env:BUNDLE_FINGERPRINT

  winget:
    needs: publish
    if: ${{ vars.WINGET_AUTO_UPDATE == 'true' }}
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      submit: true
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
