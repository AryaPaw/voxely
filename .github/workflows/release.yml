name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Strict X.Y.Z version matching manifests
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 75
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT -eq "workflow_dispatch") {
            $version = $env:REQUESTED_VERSION
          } else {
            $tag = $env:RELEASE_REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must be vX.Y.Z" }
            $version = $tag.TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be X.Y.Z" }
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build date from CI
        shell: pwsh
        run: echo "VOXELY_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" >> $env:GITHUB_ENV
      - name: Version SSOT
        shell: pwsh
        run: ./scripts/check-version.ps1 -Expected "${{ steps.ver.outputs.version }}"
      - name: Verify release identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/publish-release.ps1 -Mode preflight -Version $env:RELEASE_VERSION -CandidateSha $env:CANDIDATE_SHA
      - name: Install frontend
        run: bun install --frozen-lockfile
      - name: Build signed NSIS
        uses: tauri-apps/tauri-action@2d3036b306d86c3198f05a460dcd23cf55ef41b9 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VOXELY_BUILD_DATE: ${{ env.VOXELY_BUILD_DATE }}
        with:
          includeUpdaterJson: false
      - name: Installer smoke
        shell: pwsh
        run: ./scripts/ci-installer-smoke.ps1 -Version "${{ steps.ver.outputs.version }}"
      - name: Write updater manifest
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem $nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          $sig = (Get-Content -Raw "$($exe.FullName).sig").Trim()
          $version = "${{ steps.ver.outputs.version }}"
          $manifest = [ordered]@{
            version = $version
            notes = ""
            pub_date = (git show -s --format=%cI HEAD).Trim()
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = "https://github.com/AryaPaw/voxely/releases/download/v$version/$($exe.Name)"
              }
            }
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $nsis "latest.json"),
            ($manifest | ConvertTo-Json -Compress -Depth 5)
          )
      - name: List NSIS artifacts
        shell: pwsh
        run: Get-ChildItem "src-tauri/target/release/bundle/nsis" | Format-Table Name, Length
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/publish-release.ps1 -Mode publish -Version $env:RELEASE_VERSION -CandidateSha $env:CANDIDATE_SHA
      - name: Attest artifacts
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*

  winget:
    needs: publish
    if: ${{ vars.WINGET_AUTO_UPDATE == 'true' }}
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      submit: true
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
