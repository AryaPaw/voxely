name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install frontend
        run: bun install --frozen-lockfile
      - name: Frontend checks
        run: bun run typecheck && bun run lint && bun run format:check && bun run coverage
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all
      - name: MSRV field matches Cargo.toml
        working-directory: src-tauri
        shell: pwsh
        run: |
          $msrv = (Select-String -Path Cargo.toml -Pattern '^rust-version\s*=').Line.Split('=')[1].Trim().Trim('"')
          if ($msrv -ne "1.85.0") { throw "expected rust-version 1.85.0, got $msrv" }
          Write-Host "MSRV $msrv (lock graph requires reqwest 0.13 via Tauri)"
      - name: Version SSOT
        shell: pwsh
        run: ./scripts/check-version.ps1
      - name: Icon SSOT
        shell: pwsh
        run: ./scripts/check-icons.ps1
      - name: Tauri compile
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release
      - name: Upload coverage
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
