name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Verification preflight
        run: bun run verify:preflight
      - name: Read MSRV
        id: msrv
        working-directory: src-tauri
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "Cargo.toml rust-version not found" }
          $version = $line.Matches[0].Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "MSRV $version"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: MSRV compile
        working-directory: src-tauri
        run: cargo +${{ steps.msrv.outputs.version }} build --locked --all-targets
      - name: Build date from CI
        shell: pwsh
        run: echo "VOXELY_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" >> $env:GITHUB_ENV
      - name: Install frontend
        run: bun install --frozen-lockfile
      - name: Frontend checks
        run: bun run verify:frontend
      - name: Rust format
        run: bun run verify:rust:format
      - name: Rust clippy
        run: bun run verify:rust:lint
      - name: Rust tests and critical regressions
        run: bun run verify:rust:tests
      - name: Rust coverage report
        shell: pwsh
        run: |
          cargo install cargo-llvm-cov --locked --version 0.6.16
          bun run verify:rust:coverage
      - name: Metadata and helper checks
        run: bun run verify:metadata
      - name: Tauri compile
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14
