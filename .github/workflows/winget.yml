name: winget

on:
  workflow_dispatch:
    inputs:
      version:
        description: X.Y.Z already published as GitHub Release vX.Y.Z
        required: true
      submit:
        description: Open a PR on microsoft/winget-pkgs
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      submit:
        required: false
        type: boolean
        default: true
    secrets:
      WINGET_CREATE_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inspect installer
        shell: pwsh
        run: ./scripts/winget-prepare.ps1 -Mode inspect -Version "${{ inputs.version }}"
      - name: Update WinGet manifest
        if: ${{ github.event_name == 'workflow_call' || inputs.submit }}
        shell: pwsh
        run: ./scripts/winget-prepare.ps1 -Mode update -Version "${{ inputs.version }}" -Submit
      - name: Generate local update only
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.submit }}
        shell: pwsh
        run: ./scripts/winget-prepare.ps1 -Mode update -Version "${{ inputs.version }}"
