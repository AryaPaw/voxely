name: winget

on:
  workflow_dispatch:
    inputs:
      version:
        description: X.Y.Z already published as GitHub Release vX.Y.Z
        required: true
      submit:
        description: Open a PR on microsoft/winget-pkgs
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      submit:
        required: false
        type: boolean
        default: true
    secrets:
      WINGET_CREATE_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  # Serialize submissions to avoid duplicate PRs; fork master is never updated.
  group: winget-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
      WINGET_VERSION: ${{ inputs.version }}
      WINGET_SUBMIT: ${{ inputs.submit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare or submit WinGet update
        shell: pwsh
        run: ./scripts/winget-prepare.ps1 -Mode update -Version $env:WINGET_VERSION -Submit:($env:WINGET_SUBMIT -eq 'true')
