[package]
name = "voxely"
version = "0.2.4"
description = "Windows voice dictation with bounded OpenRouter retries"
authors = ["Voxely"]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"
default-run = "voxely"

[lib]
name = "voxely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
hound = "3"
rubato = "0.16"
nnnoiseless = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
keyring = { version = "3", features = ["windows-native"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
rtrb = "0.3"
parking_lot = "0.12"
bytes = "1"
httpdate = "1"
rand = "0.8"
base64 = "0.22"
directories = "5"
once_cell = "1"
sha2 = "0.10"
tauri-plugin-notification = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
] }

[dev-dependencies]
proptest = "1"
httpmock = "0.7"
tempfile = "3"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[[bench]]
name = "dsp_pipeline"
harness = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.easyfft]
opt-level = 3
